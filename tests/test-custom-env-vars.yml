name: Test custom environment variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # We need komac to be present for the action to succeed.
      # Pre-install a stub komac so the action skips installation and
      # proceeds to set env vars and run our stub.
      - name: Install stub komac
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/komac" << 'EOF'
          #!/bin/sh
          echo "stub komac $@"
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/komac"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          args: --version
          custom-fork-owner: my-fork-owner
          custom-tool: my-custom-tool
          custom-tool-url: https://example.com/my-tool

      - name: Assert KOMAC_FORK_OWNER is set
        env:
          ACTUAL: ${{ env.KOMAC_FORK_OWNER }}
        run: |
          echo "KOMAC_FORK_OWNER: $ACTUAL"
          if [ "$ACTUAL" != "my-fork-owner" ]; then
            echo "FAIL: expected KOMAC_FORK_OWNER='my-fork-owner', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert KOMAC_CREATED_WITH is set
        env:
          ACTUAL: ${{ env.KOMAC_CREATED_WITH }}
        run: |
          echo "KOMAC_CREATED_WITH: $ACTUAL"
          if [ "$ACTUAL" != "my-custom-tool" ]; then
            echo "FAIL: expected KOMAC_CREATED_WITH='my-custom-tool', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert KOMAC_CREATED_WITH_URL is set
        env:
          ACTUAL: ${{ env.KOMAC_CREATED_WITH_URL }}
        run: |
          echo "KOMAC_CREATED_WITH_URL: $ACTUAL"
          if [ "$ACTUAL" != "https://example.com/my-tool" ]; then
            echo "FAIL: expected KOMAC_CREATED_WITH_URL='https://example.com/my-tool', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
